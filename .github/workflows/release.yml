name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          zip -r Password-Manager-${GITHUB_REF_NAME}.zip . \
            -x ".git/*" ".github/*" "__pycache__/*" ".venv/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Password-Manager-${{ github.ref_name }}.zip
